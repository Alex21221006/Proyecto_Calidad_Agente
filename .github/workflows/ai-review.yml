name: Gentleman Guardian Angel (AI Review)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Asegurar Node.js para poder usar npm
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Gentleman Guardian Angel
        run: |
          git clone https://github.com/Gentleman-Programming/gentleman-guardian-angel.git /tmp/gga
          chmod +x /tmp/gga/bin/gga
          echo "/tmp/gga/bin" >> $GITHUB_PATH

      - name: Install Gemini CLI
        run: |
          npm install -g @google/gemini-cli
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run AI Review (only changed files)
        shell: bash
        env:
          #evita "No provider configured"
          GGA_PROVIDER: gemini

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            echo "Evento: PR -> comparando contra $BASE"
            git fetch origin "${{ github.base_ref }}" --depth=1 || true
            git diff --name-only "$BASE"...HEAD > /tmp/changed_files.txt
          else
            echo "Evento: PUSH -> comparando contra commit anterior"
            git diff --name-only HEAD~1...HEAD > /tmp/changed_files.txt || true
          fi

          echo "Archivos detectados:"
          cat /tmp/changed_files.txt || true

          if [ ! -s /tmp/changed_files.txt ]; then
            echo "No hay archivos para revisar. Saliendo OK."
            exit 0
          fi

          cat /tmp/changed_files.txt | xargs -r git add
          gga run
